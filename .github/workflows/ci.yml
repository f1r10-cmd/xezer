name: CI

# Yalnız kodun keyfiyyətini yoxlayır: lint, test, coverage, secret scanning.
# QEYD: testlər yalnız loopback (127.0.0.1) fixture-larına qarşı işləyir —
# CI HƏÇ VAXT xarici hədəfə şəbəkə trafiki göndərmir.
on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  lint:
    name: Lint (ruff)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install dev dependencies
        run: pip install -r requirements-dev.txt
      - name: Ruff
        run: ruff check --select E4,E7,E9,F,B,W .

  test:
    name: Tests (py${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install dev dependencies
        run: pip install -r requirements-dev.txt
      - name: Byte-compile (import/syntax gate)
        run: python -m compileall -q qbh main.py
      - name: Pytest with coverage
        run: python -m pytest --cov=qbh --cov-report=term-missing

  secret-scan:
    name: Secret scanning (gitleaks)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: gitleaks
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
