name: CI

# Yalnız kodun keyfiyyətini yoxlayır: lint, test, coverage, secret scanning.
# QEYD: testlər yalnız loopback (127.0.0.1) fixture-larına qarşı işləyir —
# CI HƏÇ VAXT xarici hədəfə şəbəkə trafiki göndərmir.
on:
  push:
    branches: ["main", "coderabbit/complete-phases-three-eight/b3af3e33"]
  pull_request:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  lint:
    name: Lint (ruff)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install dev dependencies
        run: pip install -r requirements-dev.txt
      - name: Ruff
        run: ruff check --select E4,E7,E9,F,B,W .

  test:
    name: Tests (py${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install dev dependencies
        run: pip install -r requirements-dev.txt
      - name: Byte-compile (import/syntax gate)
        run: python -m compileall -q qbh main.py
      - name: Stable benchmark without overwriting baseline
        run: |
          python - <<'PYBENCH'
          import asyncio, json
          from tests.benchmarks.run_baseline import _amain, compare, bench_metrics, BASELINE_PATH
          baseline = json.loads(BASELINE_PATH.read_text())
          first = asyncio.run(_amain(write=False))
          second = asyncio.run(_amain(write=False))
          assert not compare(baseline, first)['regressions']
          assert bench_metrics(first) == bench_metrics(second)
          PYBENCH
      - name: Pytest with coverage
        run: python -m pytest --cov=qbh --cov-report=term-missing --cov-fail-under=70

  secret-scan:
    name: Secret scanning (gitleaks)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: gitleaks
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  smoke:
    name: Loopback smoke (CLI end-to-end)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install dev dependencies
        run: pip install -r requirements-dev.txt
      - name: Byte-compile (import/syntax gate)
        run: python -m compileall -q qbh main.py
      - name: Report mode smoke (reads DB, no network)
        run: python main.py --config config/examples/example_local.yaml --mode report
      - name: Full-pipeline and report smoke tests
        run: python -m pytest tests/test_smoke.py -q
