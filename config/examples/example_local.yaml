# QBH "Xəzər" — təhlükəsiz LOKAL nümunə konfiqurasiya.
#
# Bu fayl YALNIZ loopback (`127.0.0.1`) scope-u təyin edir → heç bir xarici
# şəbəkə trafiki mümkün deyil. Smoke test / yerli inkişaf üçün istifadə olunur.
#
# İstifadə:
#   python main.py --config config/examples/example_local.yaml --mode full
program: "QBH-local-example"
nvd_api_key: ""                 # istəyə bağlı (NVD rate limitini artırır)
aggressiveness: aggressive      # passive | normal | aggressive

# Yeganə toxunulmaz sərhəd — yalnız 127.0.0.1 icazəlidir (fail-closed).
scope:
  - domain: 127.0.0.1
    in_scope:
      - 127.0.0.1
    out_of_scope: []

limits:
  requests_per_second: 5        # host başına rate limit
  max_subdomains_per_target: 50
  max_concurrency: 5
  connect_timeout: 10
  total_timeout: 30
  cooldown: 60

proxy_file: ""                  # rotasiya üçün proxy siyahısı (OPSEC)

# Proqramın qadağaları (RoE) — verilən hərəkət atlanır və audit olunur.
program_rules:
  forbidden: []                 # məs.: ["cve_poc", "race"]
  allow_wildcard_expansion: true
  max_requests_per_second: 0    # 0 → profil/limits default

rotation:
  enabled: true
  ua: true
  headers: true
  proxy: false
  on_block: true

block_strategy:
  http_429: respect              # respect | rotate | backoff_then_rotate
  http_403: backoff              # backoff | rotate | escalate_bypass

chain:
  enabled: true
  max_depth: 3
  max_tasks: 200

oob:
  enabled: false                 # lokal nümunədə callback gözlənilmir
  domain: ""
  listen_host: 127.0.0.1
  backend: local

antiblock:
  interface: "lo"
